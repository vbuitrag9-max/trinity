<script>
  async function enviarMensaje() {
    const input = document.getElementById('userInput'); // O el ID de su campo de texto
    const texto = input.value;
    if (!texto) return;

    // Agregar mensaje del usuario a la consola visual
    agregarMensajeUI("USUARIO", texto);
    input.value = "";

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: texto })
      });
      const data = await response.json();
      
      // Mostrar la respuesta del bot (Gemini / Make)
      agregarMensajeUI("TRINITY", data.reply);
    } catch (error) {
      agregarMensajeUI("TRINITY", "Error de comunicación con el núcleo.");
    }
  }
</script>
